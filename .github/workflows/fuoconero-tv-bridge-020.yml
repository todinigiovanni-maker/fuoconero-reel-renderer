name: Fuoconero TV Bridge 0.5.3 SAFE TEST APK
on:
  push:
    branches:
      - fuoconero-iptv-053-fullscreen-hd
      - fix/iptv-053-import-loop
    paths:
      - 'tv-bridge-020/**'
      - '.github/workflows/fuoconero-tv-bridge-020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (current)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Persist ONLY the temporary debug signing key between GitHub Actions runs.
      # Future 0.5.x test APKs can then update without reinstalling the app.
      - name: Stable development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuoconero-iptv-053-test-signing-v2
      - name: Ensure persistent debug signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fuoconero IPTV Debug, O=Fuoconero, C=IT"
          fi
      - name: Build APK
        working-directory: tv-bridge-020
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-TV-Bridge-0.5.3-safe-test
          path: tv-bridge-020/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
