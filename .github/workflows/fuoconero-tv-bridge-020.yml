name: Fuoconero TV Bridge 0.2 APK
on:
  push:
    branches:
      - fuoconero-tv-bridge-020
    paths:
      - 'tv-bridge-020/**'
      - '.github/workflows/fuoconero-tv-bridge-020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (current)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: tv-bridge-020
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-TV-Bridge-0.2.0-debug
          path: tv-bridge-020/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
