name: Fuoconero Netflix independent test
on:
  push:
    branches: [fuoconero-netflix-independent-test]
    paths: ['netflix-test/**', '.github/workflows/fuoconero-netflix-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuoconero-netflix-independent-signing-v1
      - name: Compile and lint independent application
        working-directory: netflix-test
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-Netflix-0.1.0-test
          path: netflix-test/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-Netflix-instrumentation
          path: netflix-test/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fuoconero-Netflix-lint
          path: netflix-test/app/build/reports/lint-results-debug.*
