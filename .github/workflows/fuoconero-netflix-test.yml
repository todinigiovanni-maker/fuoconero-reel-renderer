name: Fuoconero Netflix independent test
on:
  push:
    branches: [fuoconero-netflix-independent-test]
    paths: ['netflix-test/**', '.github/workflows/fuoconero-netflix-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUOCONERO_TEST_KEYSTORE: ${{ github.workspace }}/.netflix-test-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ${{ env.FUOCONERO_TEST_KEYSTORE }}
          key: fuoconero-netflix-news-it-signing-v1
      - name: Prepare persistent independent test signing key
        shell: bash
        run: |
          mkdir -p "$(dirname "$FUOCONERO_TEST_KEYSTORE")"
          if [ ! -s "$FUOCONERO_TEST_KEYSTORE" ]; then
            keytool -genkeypair -noprompt -keystore "$FUOCONERO_TEST_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Fuoconero Netflix News Test,O=Fuoconero,C=IT" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Compile and lint independent application
        working-directory: netflix-test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-Netflix-Novita-Italia-0.2.0-test
          path: netflix-test/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fuoconero-Netflix-instrumentation
          path: netflix-test/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fuoconero-Netflix-lint
          path: netflix-test/app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fuoconero-Netflix-unit-tests
          path: netflix-test/app/build/reports/tests/testDebugUnitTest/
