name: Fuoconero TV Bridge debug APK

on:
  push:
    branches:
      - fuoconero-tv-bridge-mvp
    paths:
      - 'android-tv-bridge/**'
      - '.github/workflows/tv-bridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android TV debug APK
        run: gradle -p android-tv-bridge --no-daemon --stacktrace assembleDebug
      - name: Upload APK for TV
        uses: actions/upload-artifact@v4
        with:
          name: fuoconero-tv-bridge-debug-apk
          path: android-tv-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
