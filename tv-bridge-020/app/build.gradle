plugins { id 'com.android.application' }
android {
    namespace 'com.fuoconero.tvbridge'
    compileSdk 35
    signingConfigs { debug { storeFile file(System.getenv('HOME') + '/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    defaultConfig {
        applicationId 'com.fuoconero.tvbridge.test043'
        minSdk 26
        targetSdk 35
        versionCode 55
        versionName '0.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
